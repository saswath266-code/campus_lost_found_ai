{% extends "base.html" %}
{% block content %}
<div class="form-wrap">
  <p class="eyebrow">{{ item_type|upper }} ITEM</p>
  <h1>Report a {{ item_type }} item</h1>
  <p>Give as much detail as possible so the matching engine can identify the right item.</p>

  <form method="POST" enctype="multipart/form-data" class="form">
    <label>Item name
      <input name="name" required placeholder="e.g. Black Nike backpack">
    </label>

    <label>Category
      <select name="category">
        <option>Bag</option><option>Mobile Phone</option><option>Laptop</option>
        <option>Earphones</option><option>ID Card</option><option>Wallet</option>
        <option>Keys</option><option>Book</option><option>Other</option>
      </select>
    </label>

    <label>Detailed description
      <textarea name="description" required placeholder="Color, brand, scratches, stickers, contents, unique marks..."></textarea>
    </label>

    <label>Location
      <input name="location" required placeholder="Library, Block A, Canteen...">
    </label>

    <label>Date & time
      <input type="datetime-local" name="event_time" required>
    </label>

    <label>Item image
      <input type="file" name="image" accept="image/*">
    </label>

    <button class="btn primary" type="submit">Submit Report</button>
  </form>
</div>
{% endblock %}
