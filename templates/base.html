<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CampusFind AI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav>
  <a class="brand" href="{{ url_for('index') }}">CampusFind <span>AI</span></a>
  <div>
    <a href="{{ url_for('report_lost') }}">Report Lost</a>
    <a href="{{ url_for('report_found') }}">Report Found</a>
    <a href="{{ url_for('admin') }}">Office</a>
  </div>
</nav>
{% with messages = get_flashed_messages() %}
  {% if messages %}
    <div class="flash">{{ messages[0] }}</div>
  {% endif %}
{% endwith %}
<main>{% block content %}{% endblock %}</main>
<footer>Campus Lost & Found • AI-assisted matching • Human verification</footer>
</body>
</html>
